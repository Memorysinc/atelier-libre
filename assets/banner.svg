<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="55%" stop-color="#1c1b1a"/>
      <stop offset="100%" stop-color="#2a2622"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#c4a574" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c4a574" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="84%" cy="80%" r="46%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4a574" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c4a574" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#f8f4ef" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f8f4ef" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="22" fill="url(#glow1)"/>
  <rect width="1280" height="360" rx="22" fill="url(#glow2)"/>

  <!-- Subtle editorial geometric hairlines -->
  <rect x="20" y="20" width="1240" height="320" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="1130" cy="110" r="145" fill="none" stroke="#c4a574" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="1130" cy="110" r="95" fill="none" stroke="#f8f4ef" stroke-opacity="0.09" stroke-width="1"/>
  <path d="M980 280 Q1110 210 1230 270" fill="none" stroke="#c4a574" stroke-opacity="0.16" stroke-width="1.2"/>

  <!-- Monogram badge -->
  <rect x="84" y="84" width="84" height="84" rx="22" fill="#f8f4ef"/>
  <text x="126" y="143" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#141414" text-anchor="middle">A</text>

  <!-- Brand title & subtitle -->
  <text x="194" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="0.5">Atelier Libre</text>
  <text x="196" y="162" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="500" fill="#d4cfc8" letter-spacing="0.3">Sistema de Gestión para Ateliers, Boutiques y Alquiler de Vestidos</text>

  <rect x="84" y="198" width="820" height="1" fill="url(#lineGrad)"/>

  <!-- Feature pills -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600">
    <rect x="84" y="224" width="142" height="34" rx="17" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="155" y="246" fill="#f8f4ef" text-anchor="middle">100 % Offline</text>

    <rect x="238" y="224" width="136" height="34" rx="17" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="306" y="246" fill="#f8f4ef" text-anchor="middle">Sin Licencias</text>

    <rect x="386" y="224" width="138" height="34" rx="17" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="455" y="246" fill="#f8f4ef" text-anchor="middle">4 Idiomas</text>

    <rect x="536" y="224" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="611" y="246" fill="#f8f4ef" text-anchor="middle">12+ Monedas</text>

    <rect x="698" y="224" width="196" height="34" rx="17" fill="#c4a574" fill-opacity="0.18" stroke="#c4a574" stroke-opacity="0.45"/>
    <text x="796" y="246" fill="#f5e6cc" text-anchor="middle">7 Temas + Modo Oscuro</text>

    <rect x="906" y="224" width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="986" y="246" fill="#f8f4ef" text-anchor="middle">Windows .EXE</text>
  </g>

  <text x="84" y="298" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#9c968e">
    Descarga directa lista para ejecutar · Control local con usuario, contraseña y código maestro · Datos privados en tu PC
  </text>
